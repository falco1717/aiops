services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiops:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIOPS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aiops}
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET:?set AIOPS_JWT_SECRET in .env}
      # Encrypts stored system credentials. Unset is allowed — the app then
      # refuses to store credentials rather than keeping them in the clear.
      AIOPS_SECRET_KEY: ${AIOPS_SECRET_KEY:-}
      AIOPS_APPROVAL_TIMEOUT_SECONDS: ${AIOPS_APPROVAL_TIMEOUT_SECONDS:-600}
      AIOPS_DEFAULT_APPROVAL_MODE: ${AIOPS_DEFAULT_APPROVAL_MODE:-ask}
      AIOPS_ADMIN_USERNAME: ${AIOPS_ADMIN_USERNAME:-admin}
      AIOPS_ADMIN_PASSWORD: ${AIOPS_ADMIN_PASSWORD:-}
      AIOPS_WORKSPACE_ROOT: /workspaces
      # Uploaded files. Fixed rather than ${}-expanded, like the workspace root
      # above: the volume below is mounted at this exact path, and a setting the
      # operator could move out from under it would only lose their uploads.
      AIOPS_ATTACHMENTS_ROOT: /attachments
      AIOPS_MAX_ATTACHMENT_BYTES: ${AIOPS_MAX_ATTACHMENT_BYTES:-26214400}
      AIOPS_SESSION_FILES_MAX: ${AIOPS_SESSION_FILES_MAX:-400}
      AIOPS_SESSION_FILES_MAX_DEPTH: ${AIOPS_SESSION_FILES_MAX_DEPTH:-3}
      AIOPS_MAX_CONCURRENT_RUNS: ${AIOPS_MAX_CONCURRENT_RUNS:-4}
      AIOPS_RUN_TIMEOUT_SECONDS: ${AIOPS_RUN_TIMEOUT_SECONDS:-3600}
      AIOPS_COOKIE_SECURE: ${AIOPS_COOKIE_SECURE:-true}
      AIOPS_SCHEDULER_ENABLED: ${AIOPS_SCHEDULER_ENABLED:-true}
      # Everything below has a working default in config.py. They are listed
      # anyway because a setting absent from this block cannot be changed by an
      # operator at all: compose reads .env only to expand ${VAR} here, and the
      # app's own env_file points at a path that does not exist in the image.
      # A setting the code offers but deployment cannot reach is not a setting.
      AIOPS_CODEX_INTERACTIVE_SANDBOX: ${AIOPS_CODEX_INTERACTIVE_SANDBOX:-workspace-write}
      AIOPS_ACCOUNT_LIMIT_COOLDOWN_SECONDS: ${AIOPS_ACCOUNT_LIMIT_COOLDOWN_SECONDS:-3600}
      AIOPS_FORWARD_SUBAGENT_TEXT: ${AIOPS_FORWARD_SUBAGENT_TEXT:-true}
      AIOPS_STREAM_PARTIAL_MESSAGES: ${AIOPS_STREAM_PARTIAL_MESSAGES:-true}
      AIOPS_INTERNAL_API_URL: ${AIOPS_INTERNAL_API_URL:-http://127.0.0.1:8000}
      # Brute-force protection on the sign-in form. AIOps may be the only thing
      # in front of an agent that runs shell commands.
      AIOPS_LOGIN_MAX_FAILURES: ${AIOPS_LOGIN_MAX_FAILURES:-5}
      AIOPS_LOGIN_FAILURE_WINDOW_SECONDS: ${AIOPS_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      AIOPS_LOGIN_LOCKOUT_SECONDS: ${AIOPS_LOGIN_LOCKOUT_SECONDS:-900}
      AIOPS_JWT_TTL_HOURS: ${AIOPS_JWT_TTL_HOURS:-720}
      AIOPS_ACCOUNTS_ROOT: ${AIOPS_ACCOUNTS_ROOT:-/home/node/accounts}
      # Agent isolation. Agent processes are started by this setuid helper as a
      # separate unprivileged user, which is what keeps the app's environment,
      # memory and private files out of an agent's reach. Setting it to an
      # empty string runs agents as the application's own user again — the
      # state in which an agent could read AIOPS_SECRET_KEY out of /proc and
      # decrypt every stored credential. There is no good reason to do that.
      AIOPS_AGENT_RUNAS: ${AIOPS_AGENT_RUNAS-/usr/local/bin/aiops-runas}
      AIOPS_AGENT_HELPER_DIR: ${AIOPS_AGENT_HELPER_DIR:-/opt/aiops-agent}
      AIOPS_CLAUDE_BIN: ${AIOPS_CLAUDE_BIN:-claude}
      AIOPS_CODEX_BIN: ${AIOPS_CODEX_BIN:-codex}
      AIOPS_SCHEDULER_TICK_SECONDS: ${AIOPS_SCHEDULER_TICK_SECONDS:-20}
      # Relay nodes. The forwarder is loopback-only inside this container and
      # takes an ephemeral port by default, so none of this is published; it is
      # here because a setting absent from this block cannot be changed at all.
      AIOPS_RELAY_FORWARDER_HOST: ${AIOPS_RELAY_FORWARDER_HOST:-127.0.0.1}
      AIOPS_RELAY_FORWARDER_PORT: ${AIOPS_RELAY_FORWARDER_PORT:-0}
      AIOPS_RELAY_CONNECT_TIMEOUT_SECONDS: ${AIOPS_RELAY_CONNECT_TIMEOUT_SECONDS:-20}
      AIOPS_RELAY_MAX_STREAMS_PER_NODE: ${AIOPS_RELAY_MAX_STREAMS_PER_NODE:-64}
      AIOPS_RELAY_ENROLMENT_TOKEN_TTL_HOURS: ${AIOPS_RELAY_ENROLMENT_TOKEN_TTL_HOURS:-24}
      AIOPS_CORS_ORIGINS: ${AIOPS_CORS_ORIGINS:-}
      AIOPS_COOKIE_NAME: ${AIOPS_COOKIE_NAME:-aiops_session}
    volumes:
      # Agent working directories. Point this at wherever your repos live.
      - ${AIOPS_WORKSPACES_HOST_PATH:-./workspaces}:/workspaces
      # Files attached to messages. A named volume, so a rebuild or a recreate
      # does not throw away the screenshot someone pasted into a conversation.
      - attachments:/attachments
      # CLI credentials. The first two are the default accounts adopted from a
      # pre-accounts install; every named account lives under accounts/.
      # Pointing CLAUDE_CONFIG_DIR at these also keeps ~/.claude.json inside a
      # volume — by default the CLI writes it to $HOME, which is not persisted.
      - claude-home:/home/node/.claude
      - codex-home:/home/node/.codex
      - agent-accounts:/home/node/accounts
    networks:
      - internal
      - proxy
    labels:
      # Set TRAEFIK_ENABLE=false when routing is defined in a Traefik file
      # provider instead (see deploy/traefik/aiops.yml). Leaving both on makes
      # two providers serve the same Host rule at equal priority.
      traefik.enable: "${TRAEFIK_ENABLE:-true}"
      traefik.docker.network: "${TRAEFIK_NETWORK:-saltbox}"

      # HTTPS router. AIOps authenticates on its own (session cookie + login
      # lockout), so the default chain is headers and real-client-IP only.
      # Add a forward-auth entry to TRAEFIK_MIDDLEWARES to put SSO in front.
      traefik.http.routers.aiops.rule: "Host(`${PUBLIC_HOSTNAME}`)"
      traefik.http.routers.aiops.entrypoints: "websecure"
      traefik.http.routers.aiops.middlewares: "${TRAEFIK_MIDDLEWARES:-globalHeaders@file,secureHeaders@file,cloudflarewarp@docker}"
      traefik.http.routers.aiops.service: "aiops"
      traefik.http.routers.aiops.tls: "true"
      traefik.http.routers.aiops.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-cfdns}"
      traefik.http.routers.aiops.tls.options: "securetls@file"

      # Plain HTTP only redirects to HTTPS. Whatever chain you set above, set
      # the matching one here — protecting one entrypoint and not the other
      # leaves an open path to the same service.
      traefik.http.routers.aiops-http.rule: "Host(`${PUBLIC_HOSTNAME}`)"
      traefik.http.routers.aiops-http.entrypoints: "web"
      traefik.http.routers.aiops-http.middlewares: "${TRAEFIK_MIDDLEWARES_HTTP:-globalHeaders@file,redirect-to-https@docker,cloudflarewarp@docker}"
      traefik.http.routers.aiops-http.service: "aiops"

      traefik.http.services.aiops.loadbalancer.server.port: "8000"

volumes:
  db-data:
  attachments:
  claude-home:
  codex-home:
  agent-accounts:

networks:
  # Private network for app <-> database. Postgres is never on the proxy net.
  internal:
    name: aiops_internal
  # The existing Traefik network, created outside this stack.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-saltbox}
